<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Angara GenAI Agent</title>
  <meta name="description" content="GO autopilot or scroll the product tour — one page." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=14" />
</head>
<body class="mode-home" data-frame="go">
  <div class="aurora" aria-hidden="true"></div>
  <div class="fx-ring" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand-block">
      <a class="brand" href="./" id="brand-home">
        <img src="assets/logo.svg" width="160" height="40" alt="Angara GenAI Agent" />
      </a>
      <p class="credit-line" id="header-credit">
        <span>Author <a class="author-link js-author" href="https://www.linkedin.com/in/farukh-shiekh-genaiqa" target="_blank" rel="noopener noreferrer">Farukh Sheikh</a></span>
        <span class="foot-sep" aria-hidden="true">·</span>
        <span class="js-copyright">© 2026 Angara Ecommerce Pvt Ltd</span>
      </p>
    </div>
    <div class="progress-wrap tour-only" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="top-status journey-only" id="top-status" hidden>
      <span class="live-dot" aria-hidden="true"></span>
      <span id="top-phase">Autopilot</span>
    </div>
    <div class="nav-links">
      <div class="scene-dots tour-only" id="scene-dots" role="tablist" aria-label="Tour chapters"></div>
      <div class="top-actions journey-only" id="top-actions" hidden>
        <button type="button" class="btn btn-ghost" id="btn-pause">Pause</button>
        <button type="button" class="btn btn-ghost" id="btn-skip">Skip</button>
        <button type="button" class="btn btn-ghost" id="btn-exit">Exit</button>
      </div>
      <button type="button" class="btn btn-secondary tour-only" id="btn-to-go">Autopilot</button>
    </div>
  </header>

  <!-- Sticky pin: GO + tour scrub in one viewport -->
  <div class="pin-wrap" id="pin-wrap">
    <div class="pin-stage" id="pin-stage">
      <!-- Layer 0: Autopilot GO -->
      <section class="layer layer-go" id="layer-go" aria-label="Autopilot">
        <div class="panel landing" id="landing">
          <img class="mark-lg" src="assets/mark.svg" width="52" height="52" alt="" />
          <p class="kicker">Autopilot · closed-loop demo</p>
          <h1>
            <span class="greet" id="landing-greet">Hi agent,</span>
            <span class="prompt-line" id="landing-prompt">test my Story</span>
          </h1>
          <label class="story-field">
            <span class="label">Story / ticket</span>
            <input id="story-input" type="text" autocomplete="off" />
          </label>
          <button type="button" class="go-btn" id="go-btn">
            <span id="go-label">GO</span>
            <span class="go-arrow" aria-hidden="true">→</span>
          </button>
          <p class="hint" id="landing-hint"></p>
          <p class="scroll-cue" id="scroll-cue">
            <span class="scroll-cue-line"></span>
            Scroll for product tour
          </p>
        </div>
      </section>

      <!-- Layer 1: Product tour frames -->
      <section class="layer layer-tour" id="layer-tour" aria-label="Product tour">
        <div class="stage-shell">
          <div class="stage-meta">
            <span class="scene-index" id="scene-index">01</span>
            <span class="scene-kicker" id="scene-kicker"></span>
          </div>
          <div class="stage-frame" id="stage-frame"></div>
          <p class="scroll-hint" id="scroll-hint-tour">Scroll · arrows also work</p>
        </div>
      </section>

      <!-- Always-on chapter scroller (GO + tour) -->
      <aside class="chapter-rail" id="chapter-rail" aria-label="Frame scroll range" hidden>
        <div class="chapter-rail-labels">
          <span id="rail-from">Now</span>
          <span id="rail-to">Next</span>
        </div>
        <div class="chapter-rail-track" title="Hold zone then crossfade">
          <i id="rail-hold" aria-hidden="true"></i>
          <b id="rail-fill"></b>
          <span class="chapter-rail-thumb" id="rail-thumb"></span>
        </div>
        <p class="chapter-rail-hint" id="rail-hint">Scroll deeper for next frame</p>
        <p class="chapter-rail-keys">↑↓ / PgUp PgDn · Space</p>
      </aside>
    </div>
    <div class="scroll-track" id="scroll-track" aria-hidden="true"></div>
  </div>

  <!-- Journey overlay (CTA path) -->
  <section class="frame frame-journey" id="frame-journey" hidden aria-live="polite">
    <div class="panel journey" id="journey">
      <div class="rail" id="rail" aria-hidden="true"></div>
      <div class="journey-head">
        <span class="phase" id="j-phase"></span>
        <div class="journey-progress"><i id="j-progress"></i></div>
      </div>
      <h2 id="j-title"></h2>
      <p class="voice" id="j-voice"></p>
      <div class="stage" id="j-stage"></div>
    </div>
  </section>

  <footer class="foot">
    <img src="assets/mark.svg" width="18" height="18" alt="" />
    <div class="foot-copy">
      <span id="foot-note"></span>
      <span class="foot-meta credit-line">
        <span>Author <a class="author-link js-author" href="https://www.linkedin.com/in/farukh-shiekh-genaiqa" target="_blank" rel="noopener noreferrer">Farukh Sheikh</a></span>
        <span class="foot-sep" aria-hidden="true">·</span>
        <span class="js-copyright">© 2026 Angara Ecommerce Pvt Ltd</span>
      </span>
    </div>
  </footer>

  <script src="app.js?v=14" defer></script>
</body>
</html>
