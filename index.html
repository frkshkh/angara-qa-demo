<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Angara GenAI Agent</title>
  <meta name="description" content="Scroll-driven product story — Angara GenAI Agent for enterprise QA." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#top" aria-label="Angara GenAI Agent home">
      <img src="assets/logo.svg" width="160" height="40" alt="Angara GenAI Agent" />
    </a>
    <div class="progress-wrap" aria-hidden="true">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="scene-dots" id="scene-dots" role="tablist" aria-label="Story chapters"></div>
  </header>

  <!-- Sticky stage: same frame; content morphs on scroll -->
  <div class="stage" id="top">
    <div class="stage-inner">
      <div class="stage-meta">
        <span class="scene-index" id="scene-index">01</span>
        <span class="scene-kicker" id="scene-kicker"></span>
      </div>
      <div class="stage-frame" id="stage-frame">
        <!-- scenes injected -->
      </div>
      <p class="scroll-hint" id="scroll-hint">Scroll to explore</p>
    </div>
  </div>

  <!-- Tall scroll track — drives scene index -->
  <div class="scroll-track" id="scroll-track" aria-hidden="true"></div>

  <footer class="foot">
    <img src="assets/mark.svg" width="20" height="20" alt="" />
    <span id="foot-note"></span>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
