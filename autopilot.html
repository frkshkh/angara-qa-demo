<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Autopilot · Angara GenAI Agent</title>
  <meta name="description" content="GO autopilot: Story → Generate → Multi-MR → CUA → Evidence → Bug → PageSpeed." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="./">
      <img src="assets/logo.svg" width="160" height="40" alt="Angara GenAI Agent" />
    </a>
    <div class="top-status" id="top-status" hidden>
      <span class="live-dot" aria-hidden="true"></span>
      <span id="top-phase">Autopilot</span>
    </div>
    <div class="nav-links">
      <div class="top-actions" id="top-actions" hidden>
        <button type="button" class="btn btn-ghost" id="btn-pause">Pause</button>
        <button type="button" class="btn btn-ghost" id="btn-skip">Skip</button>
        <button type="button" class="btn btn-ghost" id="btn-restart">Restart</button>
      </div>
      <a class="btn btn-secondary" href="./">Product tour</a>
    </div>
  </header>

  <main class="ap-viewport">
    <section class="panel landing" id="landing" aria-label="Start autopilot">
      <img class="mark-lg" src="assets/mark.svg" width="52" height="52" alt="" />
      <p class="kicker">Autopilot · closed-loop demo</p>
      <h1>
        <span class="greet" id="landing-greet">Hi agent,</span>
        <span class="prompt-line" id="landing-prompt">test my Story</span>
      </h1>
      <label class="story-field">
        <span class="label">Story / ticket</span>
        <input id="story-input" type="text" autocomplete="off" />
      </label>
      <button type="button" class="go-btn" id="go-btn">
        <span id="go-label">GO</span>
        <span aria-hidden="true">→</span>
      </button>
      <p class="hint" id="landing-hint"></p>
      <div class="mode-switch">
        <p>Want the scroll product tour instead?</p>
        <a class="btn btn-secondary" href="./">Open general demo</a>
      </div>
    </section>

    <section class="panel journey" id="journey" hidden aria-live="polite">
      <div class="rail" id="rail" aria-hidden="true"></div>
      <div class="journey-head">
        <span class="phase" id="j-phase"></span>
        <div class="journey-progress"><i id="j-progress"></i></div>
      </div>
      <h2 id="j-title"></h2>
      <p class="voice" id="j-voice"></p>
      <div class="stage" id="j-stage"></div>
    </section>
  </main>

  <footer class="foot">
    <img src="assets/mark.svg" width="18" height="18" alt="" />
    <span id="foot-note"></span>
  </footer>

  <script src="autopilot.js?v=5" defer></script>
</body>
</html>
